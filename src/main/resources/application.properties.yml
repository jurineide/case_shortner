spring:
  datasource:
    url: jdbc:h2:mem:urlshortnerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      show-sql: false
      properties:
        hibernate:
          format_sql: false
    h2:
      console:
        enabled: true
        path: /h2-console

server:
  port: 8080

app:
  base-url: http://localhost:8080
  api-key: ${API_KEY:my-secret-api-key}

logging:
  level:
    com.shortner.urlshortner: INFO
